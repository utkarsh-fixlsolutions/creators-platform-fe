<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta
      name="description"
      content="Creators Platform — a discovery feed for the work you love. Follow creators, unlock exclusive drops, and find what's next."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Creators Platform — Discovery Feed</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- TEMPORARY — wireframe mode: strips every <img> src so layout can be
         judged without stock photography. Delete this block to restore images. -->
    <script>
      (function () {
        function stripImages() {
          document.querySelectorAll("img:not([data-keep-image])").forEach(function (img) {
            if (img.getAttribute("src")) {
              img.removeAttribute("src");
              img.removeAttribute("srcset");
            }
          });
        }
        stripImages();
        new MutationObserver(stripImages).observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src", "srcset"],
        });
      })();
    </script>
  </body>
</html>
